<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOEIC 매일 10단어</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eef4ff 0%, #f8fbff 45%, #fff7ed 100%);
      color: #1f2937;
      padding: 24px;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .title-box h1 {
      font-size: 32px;
      color: #1d4ed8;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .title-box p {
      color: #64748b;
      font-size: 15px;
    }

    .day-control {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid #dbeafe;
      border-radius: 20px;
      padding: 10px 14px;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.08);
    }

    button, select {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button {
      background: #2563eb;
      color: white;
      font-weight: 700;
    }

    button:hover {
      transform: translateY(-1px);
      background: #1d4ed8;
    }

    .ghost {
      background: #e0ecff;
      color: #1d4ed8;
    }

    .ghost:hover {
      background: #bfdbfe;
    }

    select {
      background: white;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      font-weight: 700;
      outline: none;
    }

    .summary {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: rgba(255,255,255,0.86);
      border: 1px solid rgba(191,219,254,0.9);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
    }

    .summary-card span {
      font-size: 13px;
      color: #64748b;
      font-weight: 700;
    }

    .summary-card strong {
      display: block;
      font-size: 25px;
      margin-top: 7px;
      color: #0f172a;
    }

    .progress-wrap {
      height: 12px;
      background: #e5edff;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 14px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #f59e0b);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .toolbar-left, .toolbar-right {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .words-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    .word-card {
      position: relative;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 18px;
      min-height: 190px;
      box-shadow: 0 16px 35px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .word-card::before {
      content: "";
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #dbeafe;
      top: -48px;
      right: -42px;
      opacity: 0.7;
    }

    .word-number {
      color: #2563eb;
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .word {
      font-size: 24px;
      font-weight: 900;
      color: #111827;
      word-break: break-word;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .pronounce {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 12px;
    }

    .meaning {
      font-size: 16px;
      line-height: 1.45;
      color: #334155;
      min-height: 46px;
      transition: 0.2s;
    }

    .meaning.hidden {
      filter: blur(6px);
      user-select: none;
    }

    .example {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.45;
      color: #64748b;
      background: #f8fafc;
      border-radius: 14px;
      padding: 10px;
    }

    .card-bottom {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .small-btn {
      flex: 1;
      padding: 9px 10px;
      font-size: 13px;
    }

    .known-btn {
      background: #f1f5f9;
      color: #334155;
    }

    .known-btn.done {
      background: #16a34a;
      color: white;
    }

    .speak-btn {
      background: #fff7ed;
      color: #c2410c;
    }

    .quiz-box {
      margin-top: 18px;
      background: rgba(255,255,255,0.9);
      border: 1px solid #fed7aa;
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
    }

    .quiz-box h2 {
      font-size: 20px;
      color: #c2410c;
      margin-bottom: 8px;
    }

    .quiz-question {
      font-size: 18px;
      font-weight: 800;
      margin: 12px 0;
    }

    .quiz-answer {
      display: none;
      color: #334155;
      line-height: 1.5;
      margin-top: 8px;
      background: #fff7ed;
      padding: 12px;
      border-radius: 14px;
    }

    footer {
      text-align: center;
      margin-top: 18px;
      color: #94a3b8;
      font-size: 13px;
    }

    @media (max-width: 1000px) {
      .words-grid { grid-template-columns: repeat(2, 1fr); }
      .summary { grid-template-columns: 1fr; }
      header { flex-direction: column; align-items: flex-start; }
    }

    @media (max-width: 600px) {
      body { padding: 14px; }
      .words-grid { grid-template-columns: 1fr; }
      .title-box h1 { font-size: 26px; }
      .day-control { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-box">
        <h1>TOEIC 매일 10단어</h1>
        <p>하루에 딱 10개씩, 뜻을 가리고 확인하면서 외우는 단어장</p>
      </div>
      <div class="day-control">
        <button class="ghost" onclick="changeDay(-1)">이전</button>
        <select id="daySelect" onchange="setDay(Number(this.value))"></select>
        <button class="ghost" onclick="changeDay(1)">다음</button>
      </div>
    </header>

    <section class="summary">
      <div class="summary-card">
        <span>오늘의 학습 날짜</span>
        <strong id="todayText">Day 1</strong>
        <div class="progress-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>
      <div class="summary-card">
        <span>외운 단어</span>
        <strong><span id="knownCount">0</span> / 10개</strong>
      </div>
      <div class="summary-card">
        <span>현재 학습 범위</span>
        <strong id="rangeText">1번 ~ 10번</strong>
      </div>
    </section>

    <div class="toolbar">
      <div class="toolbar-left">
        <button onclick="toggleAllMeanings()" id="toggleMeaningBtn">뜻 전체 가리기</button>
        <button class="ghost" onclick="resetToday()">오늘 체크 초기화</button>
      </div>
      <div class="toolbar-right">
        <button onclick="makeQuiz()">랜덤 문제 내기</button>
      </div>
    </div>

    <main class="words-grid" id="wordsGrid"></main>

    <section class="quiz-box">
      <h2>랜덤 복습 문제</h2>
      <p>버튼을 누르면 오늘 단어 10개 중 하나가 문제로 나옵니다.</p>
      <div class="quiz-question" id="quizQuestion">아직 문제가 없습니다.</div>
      <button class="ghost" onclick="showQuizAnswer()">정답 보기</button>
      <div class="quiz-answer" id="quizAnswer"></div>
    </section>

    <footer>체크 상태는 이 브라우저에 자동 저장됩니다.</footer>
  </div>

    const vocab = rawVocab.split("
").map((line) => {
      const [word, meaning] = line.split("|");
      return {
        word,
        pronounce: "듣기 버튼으로 확인",
        meaning,
        example: `TOEIC keyword: ${word}`
      };
    });

    const wordsPerDay = 10;
    const totalDays = Math.ceil(vocab.length / wordsPerDay);
    let currentDay = Number(localStorage.getItem("toeic-current-day")) || 1;
    let meaningsHidden = false;
    let currentQuiz = null;

    const daySelect = document.getElementById("daySelect");
    const wordsGrid = document.getElementById("wordsGrid");

    function initDaySelect() {
      daySelect.innerHTML = "";
      for (let i = 1; i <= totalDays; i++) {
        const option = document.createElement("option");
        option.value = i;
        option.textContent = `Day ${i}`;
        daySelect.appendChild(option);
      }
    }

    function getTodayWords() {
      const start = (currentDay - 1) * wordsPerDay;
      return vocab.slice(start, start + wordsPerDay);
    }

    function getStorageKey(index) {
      return `toeic-known-${index}`;
    }

    function isKnown(globalIndex) {
      return localStorage.getItem(getStorageKey(globalIndex)) === "true";
    }

    function render() {
      localStorage.setItem("toeic-current-day", currentDay);
      daySelect.value = currentDay;
      const start = (currentDay - 1) * wordsPerDay;
      const todayWords = getTodayWords();

      document.getElementById("todayText").textContent = `Day ${currentDay}`;
      document.getElementById("rangeText").textContent = `${start + 1}번 ~ ${start + todayWords.length}번`;

      wordsGrid.innerHTML = "";

      todayWords.forEach((item, i) => {
        const globalIndex = start + i;
        const card = document.createElement("article");
        card.className = "word-card";
        card.innerHTML = `
          <div>
            <div class="word-number">#${globalIndex + 1}</div>
            <div class="word">${item.word}</div>
            <div class="pronounce">발음: ${item.pronounce}</div>
            <div class="meaning ${meaningsHidden ? "hidden" : ""}" id="meaning-${globalIndex}">${item.meaning}</div>
            <div class="example">${item.example}</div>
          </div>
          <div class="card-bottom">
            <button class="small-btn speak-btn" onclick="speakWord('${item.word}')">듣기</button>
            <button class="small-btn known-btn ${isKnown(globalIndex) ? "done" : ""}" onclick="toggleKnown(${globalIndex})">
              ${isKnown(globalIndex) ? "외움 완료" : "체크"}
            </button>
          </div>
        `;
        wordsGrid.appendChild(card);
      });

      updateProgress();
    }

    function updateProgress() {
      const start = (currentDay - 1) * wordsPerDay;
      const count = getTodayWords().filter((_, i) => isKnown(start + i)).length;
      document.getElementById("knownCount").textContent = count;
      document.getElementById("progressBar").style.width = `${count * 10}%`;
    }

    function setDay(day) {
      currentDay = Math.min(Math.max(day, 1), totalDays);
      currentQuiz = null;
      document.getElementById("quizQuestion").textContent = "아직 문제가 없습니다.";
      document.getElementById("quizAnswer").style.display = "none";
      render();
    }

    function changeDay(amount) {
      setDay(currentDay + amount);
    }

    function toggleKnown(globalIndex) {
      localStorage.setItem(getStorageKey(globalIndex), !isKnown(globalIndex));
      render();
    }

    function toggleAllMeanings() {
      meaningsHidden = !meaningsHidden;
      document.getElementById("toggleMeaningBtn").textContent = meaningsHidden ? "뜻 전체 보기" : "뜻 전체 가리기";
      render();
    }

    function resetToday() {
      const start = (currentDay - 1) * wordsPerDay;
      getTodayWords().forEach((_, i) => localStorage.removeItem(getStorageKey(start + i)));
      render();
    }

    function speakWord(word) {
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = "en-US";
      utterance.rate = 0.85;
      speechSynthesis.speak(utterance);
    }

    function makeQuiz() {
      const todayWords = getTodayWords();
      currentQuiz = todayWords[Math.floor(Math.random() * todayWords.length)];
      document.getElementById("quizQuestion").textContent = `Q. '${currentQuiz.meaning}'에 해당하는 영어 단어는?`;
      const answer = document.getElementById("quizAnswer");
      answer.style.display = "none";
      answer.textContent = `정답: ${currentQuiz.word} / 예문: ${currentQuiz.example}`;
    }

    function showQuizAnswer() {
      if (!currentQuiz) makeQuiz();
      document.getElementById("quizAnswer").style.display = "block";
    }

    initDaySelect();
    render();
  </script>
