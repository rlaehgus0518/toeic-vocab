<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEIC 매일 10단어</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eaf2ff, #fff7ed);
      color: #172033;
      padding: 22px;
    }
    .wrap {
      max-width: 1150px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    h1 {
      color: #1d4ed8;
      font-size: 34px;
      letter-spacing: -1px;
    }
    .sub {
      color: #64748b;
      margin-top: 6px;
    }
    .panel {
      background: rgba(255,255,255,.9);
      border: 1px solid #dbeafe;
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 12px 28px rgba(30, 64, 175, .08);
    }
    .day-box {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    button, select {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 800;
      font-size: 14px;
    }
    button {
      background: #2563eb;
      color: white;
    }
    button:hover {
      background: #1d4ed8;
    }
    .ghost {
      background: #dbeafe;
      color: #1d4ed8;
    }
    select {
      background: white;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      outline: none;
    }
    .stats {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }
    .stat span {
      color: #64748b;
      font-size: 13px;
      font-weight: 800;
    }
    .stat strong {
      display: block;
      font-size: 25px;
      margin-top: 7px;
    }
    .progress {
      margin-top: 13px;
      height: 12px;
      background: #e5edff;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #f59e0b);
      transition: width .2s;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }
    .card {
      background: white;
      border-radius: 22px;
      border: 1px solid #e2e8f0;
      padding: 17px;
      min-height: 180px;
      box-shadow: 0 14px 28px rgba(15, 23, 42, .08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .num {
      color: #2563eb;
      font-weight: 900;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .word {
      font-size: 25px;
      font-weight: 900;
      margin-bottom: 8px;
      word-break: break-word;
    }
    .mean {
      font-size: 16px;
      color: #334155;
      line-height: 1.45;
      min-height: 42px;
    }
    .hidden {
      filter: blur(6px);
      user-select: none;
    }
    .ex {
      margin-top: 10px;
      padding: 9px;
      background: #f8fafc;
      border-radius: 14px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.45;
    }
    .bottom {
      display: flex;
      gap: 8px;
      margin-top: 13px;
    }
    .bottom button {
      flex: 1;
      padding: 9px;
      font-size: 13px;
    }
    .speak {
      background: #fff7ed;
      color: #c2410c;
    }
    .known {
      background: #f1f5f9;
      color: #334155;
    }
    .known.done {
      background: #16a34a;
      color: white;
    }
    .quiz-start-box {
      margin: 18px 0 10px;
      display: flex;
      justify-content: center;
    }
    .quiz-start-box button {
      width: min(100%, 420px);
      padding: 14px 18px;
      font-size: 16px;
      background: #f97316;
      box-shadow: 0 10px 24px rgba(249, 115, 22, .18);
    }
    .quiz-start-box button:hover {
      background: #ea580c;
    }
    .quiz {
      margin-top: 0;
      border-color: #fed7aa;
    }
    .quiz h2 {
      color: #c2410c;
      margin-bottom: 8px;
    }
    #quizQuestion {
      margin: 12px 0;
      font-weight: 900;
      font-size: 18px;
    }
    #quizAnswer {
      display: none;
      background: #fff7ed;
      padding: 12px;
      border-radius: 14px;
      line-height: 1.5;
      color: #334155;
    }
    footer {
      text-align: center;
      margin-top: 18px;
      color: #94a3b8;
      font-size: 13px;
    }
    @media (max-width: 1000px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .stats { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      body { padding: 13px; }
      h1 { font-size: 27px; }
      .grid { grid-template-columns: 1fr; }
      .quiz-start-box {
        position: sticky;
        bottom: 10px;
        z-index: 20;
      }
      .quiz-start-box button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>TOEIC 매일 10단어</h1>
        <p class="sub">30일 동안 하루 10개씩 외우는 효리 전용 토익 단어장</p>
      </div>
      <div class="panel day-box">
        <button class="ghost" id="prevBtn">이전</button>
        <select id="daySelect"></select>
        <button class="ghost" id="nextBtn">다음</button>
      </div>
    </header>

    <section class="stats">
      <div class="panel stat">
        <span>오늘 학습</span>
        <strong id="dayTitle">Day 1</strong>
        <div class="progress"><div class="bar" id="bar"></div></div>
      </div>
      <div class="panel stat">
        <span>외운 단어</span>
        <strong><span id="knownCount">0</span> / 10개</strong>
      </div>
      <div class="panel stat">
        <span>학습 범위</span>
        <strong id="rangeText">1번 ~ 10번</strong>
      </div>
    </section>

    <div class="toolbar">
      <div>
        <button id="toggleBtn">뜻 전체 가리기</button>
        <button class="ghost" id="resetBtn">오늘 체크 초기화</button>
      </div>    </div>

    <main class="grid" id="grid"></main>

    <div class="quiz-start-box">
      <button id="quizBtn">10개 다 외웠으면 랜덤 문제 내기</button>
    </div>

    <section class="panel quiz">
      <h2>랜덤 복습 문제</h2>
      <p>오늘 단어 10개 중 하나가 문제로 나옵니다.</p>
      <div id="quizQuestion">아직 문제가 없습니다.</div>
      <button class="ghost" id="answerBtn">정답 보기</button>
      <div id="quizAnswer"></div>
    </section>

    <footer>외운 단어 체크는 이 브라우저에 자동 저장됩니다.</footer>
  </div>

  <script>
    const rawVocab = ['accommodate|수용하다, 숙박시키다', 'adjacent|인접한, 가까운', 'agenda|의제, 안건', 'allocate|할당하다, 배분하다', 'applicant|지원자, 신청자', 'approve|승인하다', 'assignment|업무, 과제, 배정', 'attend|참석하다', 'benefit|혜택, 이익', 'candidate|후보자, 지원자', 'capacity|수용 능력, 용량', 'comply|준수하다, 따르다', 'consecutive|연속적인', 'considerable|상당한', 'contract|계약, 계약서', 'convenient|편리한', 'deadline|마감일', 'defective|결함이 있는', 'delay|지연, 연기하다', 'department|부서', 'designate|지정하다', 'discount|할인', 'efficient|효율적인', 'eligible|자격이 있는', 'encourage|장려하다, 격려하다', 'ensure|보장하다, 확실히 하다', 'estimate|견적, 추정하다', 'expand|확장하다', 'expense|비용, 지출', 'facility|시설', 'frequent|빈번한', 'inventory|재고, 목록', 'invoice|청구서, 송장', 'maintain|유지하다, 관리하다', 'mandatory|의무적인, 필수의', 'notify|알리다, 통지하다', 'obtain|얻다, 획득하다', 'outstanding|뛰어난, 미지불된', 'permit|허가하다, 허가증', 'postpone|연기하다', 'procedure|절차', 'purchase|구매하다, 구매', 'recruit|모집하다, 채용하다', 'refund|환불', 'regarding|~에 관하여', 'reliable|믿을 수 있는', 'renovate|수리하다, 개조하다', 'replace|교체하다', 'require|요구하다, 필요로 하다', 'reservation|예약', 'schedule|일정, 예정하다', 'shipment|배송, 선적', 'submit|제출하다', 'supervisor|관리자, 감독관', 'temporary|임시의', 'thorough|철저한', 'transfer|이전하다, 이동하다', 'urgent|긴급한', 'vacant|비어 있는', 'warranty|보증, 보증서', 'absent|결석한, 부재중인', 'access|접근, 이용 권한', 'account|계좌, 거래처, 설명', 'accurate|정확한', 'achieve|달성하다', 'acknowledge|인정하다, 확인하다', 'acquire|획득하다', 'activate|작동시키다, 활성화하다', 'additional|추가의', 'adequate|충분한, 적절한', 'adjust|조정하다, 적응하다', 'administration|관리, 행정', 'advance|진전, 사전의', 'advertise|광고하다', 'affordable|감당할 수 있는, 저렴한', 'agency|대행사, 기관', 'agreement|계약, 동의', 'alternative|대안, 대체의', 'annual|연례의, 매년의', 'anticipate|예상하다', 'apologize|사과하다', 'application|지원서, 신청서', 'appointment|약속, 임명', 'appreciate|감사하다, 진가를 인정하다', 'appropriate|적절한', 'approximately|대략', 'arrangement|준비, 배열', 'assemble|조립하다, 모이다', 'assess|평가하다', 'assist|돕다', 'associate|관련시키다, 동료', 'assume|가정하다, 맡다', 'assure|보장하다', 'attach|첨부하다, 붙이다', 'authorize|승인하다, 권한을 주다', 'available|이용 가능한', 'aware|알고 있는', 'balance|잔액, 균형', 'branch|지점, 부서', 'brief|간단한, 보고하다', 'brochure|안내 책자', 'budget|예산', 'bulk|대량, 대부분', 'calculate|계산하다', 'cancel|취소하다', 'career|경력, 직업', 'caution|주의', 'certificate|증명서', 'chairperson|의장', 'charge|요금, 청구하다', 'circulate|회람하다, 순환하다', 'client|고객', 'collaborate|협력하다', 'colleague|동료', 'commence|시작하다', 'commercial|상업의, 광고', 'commission|수수료, 위원회', 'commitment|약속, 헌신', 'commute|통근하다', 'compare|비교하다', 'compensation|보상, 급여', 'competitive|경쟁력 있는', 'complete|완료하다, 완전한', 'complex|복잡한', 'component|부품, 구성 요소', 'comprehensive|포괄적인', 'concern|우려, 관련되다', 'condition|조건, 상태', 'conduct|수행하다, 행동', 'confirm|확인하다', 'conflict|충돌, 갈등', 'consider|고려하다', 'consult|상담하다', 'consumer|소비자', 'contact|연락하다, 연락처', 'contain|포함하다', 'contribute|기여하다', 'cooperate|협력하다', 'coordinate|조정하다', 'corporate|기업의', 'costly|비용이 많이 드는', 'courier|배송업체, 배달원', 'cover|포함하다, 덮다', 'credentials|자격, 증명서', 'crucial|중요한', 'currently|현재', 'customize|맞춤 제작하다', 'decline|거절하다, 감소하다', 'dedicated|헌신적인, 전용의', 'deficit|적자, 부족액', 'deliver|배송하다, 전달하다', 'deposit|보증금, 입금하다', 'describe|묘사하다, 설명하다', 'desirable|바람직한', 'despite|~에도 불구하고', 'determine|결정하다, 알아내다', 'develop|개발하다, 발전시키다', 'directly|직접적으로', 'directory|주소록, 명부', 'distribute|배포하다, 분배하다', 'diverse|다양한', 'document|문서, 기록하다', 'domestic|국내의, 가정의', 'durable|내구성이 있는', 'earnings|수익, 소득', 'effectively|효과적으로', 'electronic|전자의', 'emergency|비상사태', 'emphasize|강조하다', 'employee|직원', 'employer|고용주', 'enclose|동봉하다', 'encounter|마주치다, 직면하다', 'enhance|향상시키다', 'enroll|등록하다', 'entire|전체의', 'equipment|장비', 'establish|설립하다, 확립하다', 'evaluate|평가하다', 'eventually|결국', 'exceed|초과하다', 'excellent|훌륭한', 'exceptional|예외적인, 뛰어난', 'exhibit|전시하다, 전시회', 'expectation|기대', 'expertise|전문 지식', 'expire|만료되다', 'extend|연장하다, 확장하다', 'extensive|광범위한', 'external|외부의', 'familiar|익숙한', 'feasible|실현 가능한', 'financial|재정의, 금융의', 'flexible|유연한', 'fluctuate|변동하다', 'forecast|예측, 예보', 'former|이전의', 'founder|창립자', 'fragile|깨지기 쉬운', 'fulfill|이행하다, 충족하다', 'function|기능, 작동하다', 'generate|창출하다, 발생시키다', 'gradually|점차적으로', 'grant|승인하다, 보조금', 'guarantee|보장하다, 보증', 'handle|처리하다', 'headquarters|본사', 'hesitate|망설이다', 'immediate|즉각적인', 'impact|영향', 'implement|시행하다, 구현하다', 'improve|개선하다', 'incentive|장려금, 혜택', 'income|소득', 'indicate|나타내다', 'individual|개인의, 개인', 'industry|산업', 'inform|알리다', 'initial|초기의', 'initiative|계획, 주도권', 'inspect|검사하다', 'install|설치하다', 'instruction|지시, 설명서', 'insurance|보험', 'intend|의도하다', 'interest|관심, 이자', 'internal|내부의', 'interpret|해석하다', 'interrupt|방해하다', 'introduce|소개하다, 도입하다', 'investigate|조사하다', 'investment|투자', 'itinerary|여행 일정', 'journal|잡지, 일지', 'launch|출시하다, 시작하다', 'layout|배치, 설계', 'lease|임대차 계약', 'legal|법률의, 합법적인', 'limited|제한된', 'location|위치', 'manufacturer|제조업체', 'material|자료, 재료', 'measure|측정하다, 조치', 'membership|회원 자격', 'mention|언급하다', 'merge|합병하다', 'method|방법', 'modify|수정하다', 'monitor|감시하다, 확인하다', 'negotiate|협상하다', 'nominate|지명하다', 'objective|목표, 객관적인', 'occupation|직업', 'operate|운영하다, 작동하다', 'opportunity|기회', 'organization|조직', 'orientation|오리엔테이션, 방향', 'outcome|결과', 'overall|전반적인', 'oversee|감독하다', 'participant|참가자', 'participate|참여하다', 'payment|지불, 결제', 'performance|실적, 성과', 'personnel|직원, 인사부', 'persuade|설득하다', 'policy|정책, 규정', 'position|직위, 위치', 'potential|잠재적인', 'prefer|선호하다', 'preparation|준비', 'previous|이전의', 'priority|우선 사항', 'process|과정, 처리하다', 'productive|생산적인', 'professional|전문적인, 전문가', 'profit|이익', 'promote|홍보하다, 승진시키다', 'promptly|즉시', 'proposal|제안서', 'prospective|장래의, 유망한', 'provide|제공하다', 'publicity|홍보, 광고 효과', 'qualification|자격', 'quarterly|분기별의', 'receipt|영수증', 'recently|최근에', 'recommend|추천하다', 'record|기록, 기록하다', 'reduce|줄이다', 'refer|언급하다, 참조하다', 'reflect|반영하다', 'register|등록하다', 'regulation|규정', 'reject|거절하다', 'relocate|이전하다', 'remain|남아 있다', 'remind|상기시키다', 'renew|갱신하다', 'representative|대표자, 직원'];

    const vocab = rawVocab.map((line) => {
      const parts = line.split("|");
      return {
        word: parts[0],
        meaning: parts[1],
        example: "The word '" + parts[0] + "' often appears in TOEIC questions."
      };
    });

    const WORDS_PER_DAY = 10;
    const totalDays = Math.ceil(vocab.length / WORDS_PER_DAY);

    let currentDay = Number(localStorage.getItem("toeic_current_day")) || 1;
    let hideMeanings = false;
    let currentQuiz = null;

    const daySelect = document.getElementById("daySelect");
    const grid = document.getElementById("grid");

    function init() {
      for (let i = 1; i <= totalDays; i++) {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = "Day " + i;
        daySelect.appendChild(opt);
      }

      document.getElementById("prevBtn").addEventListener("click", () => setDay(currentDay - 1));
      document.getElementById("nextBtn").addEventListener("click", () => setDay(currentDay + 1));
      daySelect.addEventListener("change", () => setDay(Number(daySelect.value)));
      document.getElementById("toggleBtn").addEventListener("click", toggleMeanings);
      document.getElementById("resetBtn").addEventListener("click", resetToday);
      document.getElementById("quizBtn").addEventListener("click", makeQuiz);
      document.getElementById("answerBtn").addEventListener("click", showAnswer);

      render();
    }

    function getStartIndex() {
      return (currentDay - 1) * WORDS_PER_DAY;
    }

    function getTodayWords() {
      return vocab.slice(getStartIndex(), getStartIndex() + WORDS_PER_DAY);
    }

    function knownKey(index) {
      return "toeic_known_" + index;
    }

    function isKnown(index) {
      return localStorage.getItem(knownKey(index)) === "true";
    }

    function setDay(day) {
      if (day < 1) day = 1;
      if (day > totalDays) day = totalDays;
      currentDay = day;
      localStorage.setItem("toeic_current_day", currentDay);
      currentQuiz = null;
      document.getElementById("quizQuestion").textContent = "아직 문제가 없습니다.";
      document.getElementById("quizAnswer").style.display = "none";
      render();
    }

    function render() {
      const start = getStartIndex();
      const todayWords = getTodayWords();

      daySelect.value = currentDay;
      document.getElementById("dayTitle").textContent = "Day " + currentDay;
      document.getElementById("rangeText").textContent = (start + 1) + "번 ~ " + (start + todayWords.length) + "번";

      grid.innerHTML = "";

      todayWords.forEach((item, i) => {
        const globalIndex = start + i;
        const card = document.createElement("article");
        card.className = "card";

        const knownClass = isKnown(globalIndex) ? "known done" : "known";
        const knownText = isKnown(globalIndex) ? "외움 완료" : "체크";
        const meanClass = hideMeanings ? "mean hidden" : "mean";

        card.innerHTML = `
          <div>
            <div class="num">#${globalIndex + 1}</div>
            <div class="word">${item.word}</div>
            <div class="${meanClass}">${item.meaning}</div>
            <div class="ex">${item.example}</div>
          </div>
          <div class="bottom">
            <button class="speak" data-word="${item.word}">듣기</button>
            <button class="${knownClass}" data-index="${globalIndex}">${knownText}</button>
          </div>
        `;

        grid.appendChild(card);
      });

      document.querySelectorAll(".speak").forEach((btn) => {
        btn.addEventListener("click", () => speak(btn.dataset.word));
      });

      document.querySelectorAll(".known").forEach((btn) => {
        btn.addEventListener("click", () => toggleKnown(Number(btn.dataset.index)));
      });

      updateProgress();
    }

    function updateProgress() {
      const start = getStartIndex();
      let count = 0;
      getTodayWords().forEach((_, i) => {
        if (isKnown(start + i)) count++;
      });
      document.getElementById("knownCount").textContent = count;
      document.getElementById("bar").style.width = (count * 10) + "%";
    }

    function toggleKnown(index) {
      localStorage.setItem(knownKey(index), String(!isKnown(index)));
      render();
    }

    function toggleMeanings() {
      hideMeanings = !hideMeanings;
      document.getElementById("toggleBtn").textContent = hideMeanings ? "뜻 전체 보기" : "뜻 전체 가리기";
      render();
    }

    function resetToday() {
      const start = getStartIndex();
      getTodayWords().forEach((_, i) => {
        localStorage.removeItem(knownKey(start + i));
      });
      render();
    }

    function speak(word) {
      // 모바일 브라우저는 음성 목록이 늦게 로딩되거나,
      // 같은 음성을 연속 재생할 때 바로 막히는 경우가 있어서 약간의 보정이 필요합니다.
      if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
        alert("이 브라우저에서는 듣기 기능을 지원하지 않습니다. 크롬이나 사파리 최신 버전으로 열어주세요.");
        return;
      }

      const play = () => {
        speechSynthesis.cancel();

        const u = new SpeechSynthesisUtterance(word);
        u.lang = "en-US";
        u.rate = 0.8;
        u.pitch = 1;
        u.volume = 1;

        const voices = speechSynthesis.getVoices();
        const englishVoice =
          voices.find(v => v.lang === "en-US") ||
          voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en")) ||
          voices[0];

        if (englishVoice) {
          u.voice = englishVoice;
        }

        setTimeout(() => {
          speechSynthesis.speak(u);
        }, 80);
      };

      const voices = speechSynthesis.getVoices();

      if (voices.length === 0) {
        speechSynthesis.onvoiceschanged = () => {
          play();
          speechSynthesis.onvoiceschanged = null;
        };

        // 일부 모바일 브라우저는 onvoiceschanged가 늦게 오거나 안 올 수 있어서 한 번 더 시도합니다.
        setTimeout(play, 300);
      } else {
        play();
      }
    }

    function makeQuiz() {
      const todayWords = getTodayWords();
      currentQuiz = todayWords[Math.floor(Math.random() * todayWords.length)];
      document.getElementById("quizQuestion").textContent = "Q. '" + currentQuiz.meaning + "'에 해당하는 영어 단어는?";
      const answer = document.getElementById("quizAnswer");
      answer.style.display = "none";
      answer.textContent = "정답: " + currentQuiz.word + " / 예문: " + currentQuiz.example;
    }

    function showAnswer() {
      if (!currentQuiz) makeQuiz();
      document.getElementById("quizAnswer").style.display = "block";
    }

    init();
  </script>
</body>
</html>
