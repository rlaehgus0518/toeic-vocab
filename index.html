<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEIC 매일 10단어</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, "Noto Sans KR", sans-serif; }
    body { min-height: 100vh; background: linear-gradient(135deg, #eaf2ff, #fff7ed); color: #172033; padding: 22px; }
    .wrap { max-width: 1180px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; margin-bottom: 18px; flex-wrap: nowrap; }
    .title-area { flex: 1 1 auto; min-width: 0; padding-top: 4px; }
    h1 { color: #1d4ed8; font-size: 34px; letter-spacing: -1px; }
    .sub { color: #64748b; margin-top: 6px; line-height: 1.55; max-width: 720px; }
    .panel { background: rgba(255,255,255,.92); border: 1px solid #dbeafe; border-radius: 22px; padding: 16px; box-shadow: 0 12px 28px rgba(30, 64, 175, .08); }
    button, select { border: 0; border-radius: 999px; padding: 10px 14px; cursor: pointer; font-weight: 800; font-size: 14px; }
    button { background: #2563eb; color: white; }
    button:hover { background: #1d4ed8; color: white; }
    .ghost { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .ghost:hover { background: #2563eb; color: white; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button:disabled:hover { background: #dbeafe; color: #1d4ed8; }

    .date-wrap { flex: 0 0 auto; display: flex; justify-content: flex-end; align-items: flex-start; }
    .date-box { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: nowrap; padding: 14px 16px; min-width: 260px; }
    .date-input { border: 1px solid #bfdbfe; border-radius: 999px; padding: 10px 14px; color: #1d4ed8; font-size: 15px; font-weight: 900; background: white; outline: none; cursor: pointer; }
    .date-input:focus { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37,99,235,.12); }
    .stars { margin-top: 8px; letter-spacing: 1px; font-size: 18px; color: #cbd5e1; white-space: nowrap; }
    .star.filled { color: #f59e0b; text-shadow: 0 1px 0 rgba(0,0,0,.08); }

    .stats { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 14px; margin-bottom: 16px; }
    .stat span { color: #64748b; font-size: 13px; font-weight: 800; }
    .stat strong { display: block; font-size: 24px; margin-top: 7px; }
    .progress { margin-top: 13px; height: 12px; background: #e5edff; border-radius: 999px; overflow: hidden; }
    .bar { width: 0%; height: 100%; background: linear-gradient(90deg, #2563eb, #f59e0b); transition: width .2s; }
    .toolbar { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
    .card { background: white; border-radius: 22px; border: 1px solid #e2e8f0; padding: 17px; min-height: 180px; box-shadow: 0 14px 28px rgba(15, 23, 42, .08); display: flex; flex-direction: column; justify-content: space-between; }
    .num { color: #2563eb; font-weight: 900; font-size: 13px; margin-bottom: 10px; }
    .word { font-size: 25px; font-weight: 900; margin-bottom: 8px; word-break: break-word; }
    .mean { font-size: 16px; color: #334155; line-height: 1.45; min-height: 42px; }
    .hidden, .quiz-blur { filter: blur(7px); user-select: none; pointer-events: none; }
    .quiz-blur { color: transparent; text-shadow: 0 0 8px rgba(15,23,42,.55); }
    .ex { margin-top: 10px; padding: 9px; background: #f8fafc; border-radius: 14px; color: #64748b; font-size: 13px; line-height: 1.45; }
    .bottom { display: flex; gap: 8px; margin-top: 13px; }
    .bottom button, .bottom div { flex: 1; padding: 9px; font-size: 13px; }
    .speak { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
    .speak:hover { background: #f97316; color: white; }
    .known-status { background: #f1f5f9; color: #334155; border-radius: 999px; text-align: center; font-weight: 900; }
    .known-status.done { background: #16a34a; color: white; }
    .quiz-start-box { margin: 18px 0 10px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .quiz-start-box button { width: min(100%, 420px); padding: 14px 18px; font-size: 16px; background: #f97316; box-shadow: 0 10px 24px rgba(249, 115, 22, .18); }
    .quiz-start-box button:hover { background: #ea580c; color: white; }
    #addRoundBtn { display: none; background: #16a34a; }
    #addRoundBtn:hover { background: #15803d; }
    .quiz { display: none; margin-top: 0; border-color: #fed7aa; }
    .quiz.show { display: block; }
    .quiz h2 { color: #c2410c; margin-bottom: 8px; }
    #quizQuestion { margin: 12px 0; font-weight: 900; font-size: 18px; }
    .quiz-input-row { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
    #quizInput { flex: 1; min-width: 180px; border: 1px solid #fed7aa; border-radius: 999px; padding: 12px 14px; font-size: 16px; outline: none; }
    #quizInput:focus { border-color: #f97316; box-shadow: 0 0 0 4px rgba(249, 115, 22, .12); }
    #quizAnswer { display: none; background: #fff7ed; padding: 12px; border-radius: 14px; line-height: 1.5; color: #334155; font-weight: 800; }
    #quizAnswer.correct { background: #dbeafe; color: #1d4ed8; border: 1px solid #93c5fd; }
    #quizAnswer.wrong { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
    #wrongList { margin-top: 10px; color: #64748b; font-size: 14px; line-height: 1.5; }
    .love-message { display: none; margin-top: 14px; padding: 18px; border-radius: 20px; background: linear-gradient(135deg, #dbeafe, #ffe4e6); color: #1d4ed8; font-size: 26px; font-weight: 900; text-align: center; box-shadow: 0 12px 28px rgba(29, 78, 216, .12); animation: popLove .35s ease; }
    @keyframes popLove { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .all-complete-panel { display: none; margin-top: 18px; border-color: #bbf7d0; }
    .all-complete-panel.show { display: block; }
    .all-complete-panel h2 { color: #15803d; margin-bottom: 8px; }
    .all-complete-sub { color: #64748b; font-size: 14px; line-height: 1.5; margin-bottom: 12px; font-weight: 700; }
    .complete-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .complete-item { background: #f8fafc; border: 1px solid #dcfce7; border-radius: 16px; padding: 11px; line-height: 1.45; }
    .complete-item strong { color: #172033; font-size: 16px; }
    .complete-item span { display: block; color: #475569; font-size: 13px; margin-top: 3px; }
    footer { text-align: center; margin-top: 18px; color: #94a3b8; font-size: 13px; }
    @media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, 1fr); } .stats { grid-template-columns: 1fr; } .complete-list { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 800px) { body { padding: 13px; } h1 { font-size: 27px; } header { flex-wrap: wrap; align-items: stretch; } .title-area { flex: 1 1 100%; } .date-wrap { flex: 1 1 100%; justify-content: flex-end; } .date-box { width: auto; min-width: 0; } .grid { grid-template-columns: 1fr; } .complete-list { grid-template-columns: 1fr; } .stars { font-size: 16px; } .quiz-input-row { flex-direction: column; } #quizInput, .quiz-input-row button { width: 100%; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title-area">
        <h1>TOEIC 매일 10단어</h1>
        <p class="sub">2026년 6월 1일부터 12월 31일까지 날짜를 선택해서 학습합니다.</p>
      </div>

      <div class="date-wrap">
        <div class="panel date-box">
          <button class="ghost" id="prevDateBtn">이전</button>
          <input
            type="date"
            id="dateSelect"
            class="date-input"
            min="2026-06-01"
            max="2026-12-31"
            value="2026-06-01"
          >
          <button class="ghost" id="nextDateBtn">다음</button>
        </div>
      </div>
    </header>

    <section class="stats">
      <div class="panel stat">
        <span>선택한 날짜</span>
        <strong id="dayTitle">2026년 6월 1일</strong>
        <div class="progress"><div class="bar" id="bar"></div></div>
      </div>
      <div class="panel stat">
        <span>현재 세트</span>
        <strong><span id="roundText">1세트</span> <span id="roundStars" class="stars"></span></strong>
      </div>
      <div class="panel stat">
        <span>외운 단어</span>
        <strong><span id="knownCount">0</span> / 10개</strong>
      </div>
    </section>

    <div class="toolbar">
      <div>
        <button id="toggleBtn">뜻 전체 가리기</button>
        <button class="ghost" id="resetBtn">현재 세트 초기화</button>
      </div>
    </div>

    <main class="grid" id="grid"></main>

    <section class="panel all-complete-panel" id="allCompletePanel">
      <h2>오늘 30개 단어 전체 복습</h2>
      <p class="all-complete-sub">3세트까지 모두 완료했습니다. 오늘 학습한 30개 단어를 한 번에 다시 확인하세요.</p>
      <div class="complete-list" id="allCompleteList"></div>
    </section>

    <div class="quiz-start-box">
      <button id="quizBtn">랜덤 복습 문제</button>
      <button id="addRoundBtn">하나더?! 10단어 추가</button>
    </div>

    <section class="panel quiz" id="quizPanel">
      <h2>랜덤 복습 문제</h2>
      <p>뜻을 보고 영어 단어를 직접 입력하세요. 현재 세트 10문제를 모두 맞히면 별이 채워집니다.</p>
      <div id="quizModeText">일반 복습 모드</div>
      <div id="quizQuestion">아직 문제가 없습니다.</div>

      <div class="quiz-input-row">
        <input id="quizInput" type="text" placeholder="영어 단어 입력">
        <button id="checkBtn">정답 체크</button>
      </div>

      <div class="quiz-input-row">
        <button class="ghost" id="studyBtn">다시 외우기</button>
        <button class="ghost" id="answerBtn">정답 보기</button>
        <button class="ghost" id="nextQuizBtn">다음 문제</button>
        <button class="ghost" id="wrongQuizBtn">오답풀이</button>
        <button class="ghost" id="clearWrongBtn">오답 초기화</button>
      </div>

      <div id="quizAnswer"></div>
      <div id="loveMessage" class="love-message"></div>
      <div id="wrongList"></div>
    </section>

    <footer>학습 기록, 별, 오답은 이 브라우저에 자동 저장됩니다.</footer>
  </div>

  <script>
    function getRandomCompleteMessage() {
      const messages = ["고생했어", "하나더?!", "쉽네~"];
      return messages[Math.floor(Math.random() * messages.length)];
    }


    function makeExample(word) {
      const examples = {
        accommodate: "The hotel can accommodate up to 300 guests.",
        adjacent: "The parking lot is adjacent to the main office.",
        agenda: "Please review the agenda before the meeting.",
        allocate: "The manager will allocate the budget next week.",
        applicant: "Each applicant must submit a resume.",

      if (examples[word]) return examples[word];

      const verbWords = new Set([

      ]);

      const adjWords = new Set([
        "absent","accurate","additional","adequate","affordable","alternative","annual","anxious","apparent","appropriate","available","aware","brief","commercial","competitive","complex","comprehensive","consistent","corporate","costly","crucial","current","dedicated","desirable","different","diverse","domestic","durable","effective","electronic","entire","essential","excellent","exceptional","extensive","external","familiar","feasible","financial","flexible","former","fragile","immediate","important","individual","initial","internal","legal","limited","necessary","official","overall","particular","possible","potential","previous","productive","professional","prospective","proper","quarterly","rapid","recent","regular","responsible","satisfactory","senior","severe","significant","specific","strict","substantial","successful","sufficient","technical","valid","various"

      if (verbWords.has(word)) {
        return "The company will " + word + " the request as soon as possible.";
      }

      if (adjWords.has(word)) {
        return "This is a " + word + " document for the meeting.";

      return "The manager discussed the " + word + " during the meeting.";
    }

      "unexpected|예상치 못한",
      "uniform|제복, 균일한",
      "unique|독특한",
      "university|대학교",
      "unlikely|가능성이 낮은"
    ];



    // 단어가 alphabetical / 같은 표현 묶음 순서대로 나오지 않도록
    // 전체 단어장을 한 번 섞어서 날짜별로 배정합니다.
    // Math.random()을 쓰면 새로고침할 때마다 단어가 바뀌므로,
    // 고정 seed 셔플을 사용해서 "랜덤처럼 섞이지만 항상 같은 순서"가 유지되게 했습니다.
    function seededRandom(seed) {
      let t = seed + 0x6D2B79F5;
      return function() {
        t += 0x6D2B79F5;
        let r = Math.imul(t ^ (t >>> 15), 1 | t);
        r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
        return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
      };
    }

    function shuffleWithSeed(arr, seed) {
      const copy = [...arr];
      const random = seededRandom(seed);
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getBucketKey(line) {
      const word = String(line).split("|")[0].trim().toLowerCase();
      return word.split(/\s+/)[0];
    }

    function buildMixedVocabLines(lines) {
      // 정확히 같은 단어 줄은 제거
      const uniqueLines = [...new Set(lines)];

      // 같은 시작어(ex. alternative, external, initial)가 한 날짜 안에 반복되지 않도록
      // 30개 단위(하루 3세트)로 섞습니다.
      const bucketsMap = new Map();
      uniqueLines.forEach((line) => {
        const key = getBucketKey(line);
        if (!bucketsMap.has(key)) bucketsMap.set(key, []);
        bucketsMap.get(key).push(line);
      });

      const buckets = Array.from(bucketsMap.entries()).map(([key, items], idx) => ({
        key,
        items: shuffleWithSeed(items, 20260601 + idx)
      }));

      const DAYS_TOTAL = 214; // 2026-06-01 ~ 2026-12-31
      const WORDS_PER_DATE_TOTAL = 30; // 하루 3세트 × 10단어
      const targetCount = Math.min(uniqueLines.length, DAYS_TOTAL * WORDS_PER_DATE_TOTAL);
      const mixed = [];
      const random = seededRandom(20261231);
      const recentKeys = [];

      for (let day = 0; day < DAYS_TOTAL && mixed.length < targetCount; day++) {
        const usedToday = new Set();

        for (let slot = 0; slot < WORDS_PER_DATE_TOTAL && mixed.length < targetCount; slot++) {
          const available = buckets.filter((bucket) => bucket.items.length > 0);
          if (available.length === 0) break;

          // 1순위: 오늘 아직 안 나온 시작어 + 최근에 덜 나온 시작어
          let candidates = available.filter((bucket) => !usedToday.has(bucket.key) && !recentKeys.includes(bucket.key));

          // 2순위: 오늘 아직 안 나온 시작어
          if (candidates.length === 0) {
            candidates = available.filter((bucket) => !usedToday.has(bucket.key));
          }

          // 3순위: 정말 단어가 부족한 경우만 아무 bucket이나 사용
          if (candidates.length === 0) candidates = available;

          // 많이 남은 bucket만 계속 고르는 문제를 피하려고 후보를 랜덤으로 고릅니다.
          const picked = candidates[Math.floor(random() * candidates.length)];
          mixed.push(picked.items.pop());
          usedToday.add(picked.key);

          recentKeys.push(picked.key);
          if (recentKeys.length > 120) recentKeys.shift();
        }
      }

      // 남는 단어가 있다면 뒤쪽에 붙이되, 기존 학습 범위에는 거의 영향이 없게 둡니다.
      const leftovers = [];
      buckets.forEach((bucket) => {
        while (bucket.items.length > 0) leftovers.push(bucket.items.pop());
      });

      return mixed.concat(shuffleWithSeed(leftovers, 20270101));
    }

    const mixedRawVocab = buildMixedVocabLines(rawVocab);

    const vocab = mixedRawVocab.map((line) => {
      const parts = line.split("|");
      return {
        word: parts[0],
        meaning: parts[1],
        example: makeExample(parts[0]),
        exampleMeaning: makeExampleMeaning(parts[0], parts[1])
      };
    });

    const WORDS_PER_ROUND = 10;
    const ROUNDS_PER_DATE = 3;
    const START_DATE = new Date(2026, 5, 1);
    const END_DATE = new Date(2026, 11, 31);
    const STORAGE_PREFIX = "toeic_calendar_v2_random_";

    let selectedDate = localStorage.getItem(STORAGE_PREFIX + "selected_date") || "2026-06-01";
    let currentRound = Number(localStorage.getItem(roundStorageKey(selectedDate))) || getActiveRoundForDate(selectedDate);
    let hideMeanings = false;
    let currentQuiz = null;
    let currentQuizResolved = false;
    let quizPool = [];
    let reviewMode = false;
    let quizCardsBlurred = false;
    let quizSessionActive = false;
    let reviewSessionHadQuestions = false;

    const dateSelect = document.getElementById("dateSelect");
    const grid = document.getElementById("grid");

    function pad(n) { return String(n).padStart(2, "0"); }
    function toDateStr(date) { return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()); }
    function parseDate(str) { const [y, m, d] = str.split("-").map(Number); return new Date(y, m - 1, d); }
    function formatKoreanDate(str) { const d = parseDate(str); return d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일"; }
    function inRange(date) { return date >= START_DATE && date <= END_DATE; }
    function dateIndex(str) { return Math.round((parseDate(str) - START_DATE) / 86400000); }
    function roundStorageKey(dateStr) { return STORAGE_PREFIX + "current_round_" + dateStr; }
    function knownKey(studyKey) { return STORAGE_PREFIX + "known_" + studyKey; }
    function wrongKey() { return STORAGE_PREFIX + "wrong_" + selectedDate + "_r" + currentRound; }
    function completeKey(dateStr, round) { return STORAGE_PREFIX + "complete_" + dateStr + "_r" + round; }
    function isRoundComplete(dateStr, round) { return localStorage.getItem(completeKey(dateStr, round)) === "true"; }
    function setRoundComplete(dateStr, round, value) {
      if (value) localStorage.setItem(completeKey(dateStr, round), "true");
      else localStorage.removeItem(completeKey(dateStr, round));
    }
    function isDateComplete(dateStr) { return [1, 2, 3].every((r) => isRoundComplete(dateStr, r)); }
    function getActiveRoundForDate(dateStr) {
      for (let r = 1; r <= ROUNDS_PER_DATE; r++) {
        if (!isRoundComplete(dateStr, r)) return r;
      }
      return ROUNDS_PER_DATE;
    }
    function clampRoundForDate(dateStr, round) {
      const n = Math.min(Math.max(Number(round) || 1, 1), ROUNDS_PER_DATE);
      // 앞 세트를 완료하지 않았으면 다음 세트로 넘어가지 못하게 막습니다.
      if (n > 1 && !isRoundComplete(dateStr, n - 1)) return getActiveRoundForDate(dateStr);
      return n;
    }
    function starHtmlForDate(dateStr) {
      let html = "";
      for (let r = 1; r <= ROUNDS_PER_DATE; r++) {
        html += '<span class="star ' + (isRoundComplete(dateStr, r) ? 'filled' : '') + '">★</span>';
      }
      return html;
    }
    function isKnown(studyKey) { return localStorage.getItem(knownKey(studyKey)) === "true"; }
    function markKnown(studyKey) { localStorage.setItem(knownKey(studyKey), "true"); }
    function unmarkKnown(studyKey) {
      localStorage.removeItem(knownKey(studyKey));
      setRoundComplete(selectedDate, currentRound, false);
    }

    function getVocabDateIndex(dateStr) {
      const d = parseDate(dateStr);
      const year = d.getFullYear();
      const month = d.getMonth() + 1;
      const day = d.getDate();

      // 6월 초반 단어가 이미 학습한 내용이라서
      // 6월 단어 묶음과 12월 단어 묶음을 서로 바꿉니다.
      // 6월 1~30일 → 기존 12월 1~30일 단어 사용
      // 12월 1~30일 → 기존 6월 1~30일 단어 사용
      // 12월 31일은 대응되는 6월 31일이 없어서 기존 12월 31일 단어를 그대로 사용합니다.
      if (year === 2026 && month === 6) {
        return dateIndex("2026-12-" + pad(day));
      }

      if (year === 2026 && month === 12 && day <= 30) {
        return dateIndex("2026-06-" + pad(day));
      }

      return dateIndex(dateStr);
    }

    function getStudyBaseIndex(dateStr, round) {
      return (getVocabDateIndex(dateStr) * ROUNDS_PER_DATE * WORDS_PER_ROUND) + ((round - 1) * WORDS_PER_ROUND);
    }
    function getStudyItem(dateStr, round, slot) {
      const absoluteIndex = getStudyBaseIndex(dateStr, round) + slot;
      // 합성 표현(available capacity 같은 두 단어 조합)을 만들지 않고,
      // 실제 등록된 단일 단어만 섞어서 배정합니다.
      // 현재 내장 단어 수보다 전체 날짜 수가 많기 때문에, 부족한 구간은 단일 단어 풀 안에서 다시 섞어 사용합니다.
      const mixedIndex = vocab.length ? ((absoluteIndex * 73 + 41) % vocab.length) : 0;
      const item = vocab[mixedIndex];
      if (!item) {
        return {
          word: "단어없음",
          meaning: "단어 데이터가 없습니다",
          example: "Please add vocabulary data.",
          exampleMeaning: "단어 데이터를 추가해 주세요.",
          studyKey: dateStr + "_r" + round + "_s" + slot,
          slot,
          displayNo: absoluteIndex + 1
        };
      }
      return {
        ...item,
        studyKey: dateStr + "_r" + round + "_s" + slot,
        slot,
        displayNo: absoluteIndex + 1
      };
    }
    function getTodayWords() {
      return Array.from({ length: WORDS_PER_ROUND }, (_, i) => getStudyItem(selectedDate, currentRound, i));
    }
    function getAllDateWords(dateStr = selectedDate) {
      const words = [];
      for (let r = 1; r <= ROUNDS_PER_DATE; r++) {
        for (let i = 0; i < WORDS_PER_ROUND; i++) {
          words.push(getStudyItem(dateStr, r, i));
        }
      }
      return words;
    }
    function isDateComplete(dateStr = selectedDate) {
      for (let r = 1; r <= ROUNDS_PER_DATE; r++) {
        if (!isRoundComplete(dateStr, r)) return false;
      }
      return true;
    }
    function getItemByStudyKey(studyKey) {
      const m = String(studyKey).match(/^(\d{4}-\d{2}-\d{2})_r(\d+)_s(\d+)$/);
      if (!m) return null;
      return getStudyItem(m[1], Number(m[2]), Number(m[3]));
    }

    function init() {
      document.getElementById("prevDateBtn").addEventListener("click", () => changeDate(-1));
      document.getElementById("nextDateBtn").addEventListener("click", () => changeDate(1));
      dateSelect.addEventListener("change", () => selectDate(dateSelect.value));
      document.getElementById("toggleBtn").addEventListener("click", toggleMeanings);
      document.getElementById("resetBtn").addEventListener("click", resetCurrentRound);
      document.getElementById("quizBtn").addEventListener("click", startNormalQuiz);
      document.getElementById("addRoundBtn").addEventListener("click", addNextRound);
      document.getElementById("studyBtn").addEventListener("click", returnToStudy);
      document.getElementById("answerBtn").addEventListener("click", showAnswer);
      document.getElementById("nextQuizBtn").addEventListener("click", skipOrNextQuiz);
      document.getElementById("checkBtn").addEventListener("click", checkAnswer);
      document.getElementById("wrongQuizBtn").addEventListener("click", startWrongQuiz);
      document.getElementById("clearWrongBtn").addEventListener("click", clearTodayWrong);
      document.getElementById("quizInput").addEventListener("keydown", (e) => { if (e.key === "Enter") checkAnswer(); });
      render();
    }

    function render() {
      renderDatePicker();
      renderCards();
      renderCompleteList();
      updateProgress();
      updateWrongList();
    }

    function renderDatePicker() {
      dateSelect.value = selectedDate;
      const current = parseDate(selectedDate);
      document.getElementById("prevDateBtn").disabled = toDateStr(current) === "2026-06-01";
      document.getElementById("nextDateBtn").disabled = toDateStr(current) === "2026-12-31";
    }

    function changeDate(diff) {
      const d = parseDate(selectedDate);
      d.setDate(d.getDate() + diff);
      if (!inRange(d)) return;
      selectDate(toDateStr(d));
    }

    function selectDate(dateStr) {
      const picked = parseDate(dateStr);
      if (!dateStr || !inRange(picked)) {
        dateSelect.value = selectedDate;
        return;
      }
      selectedDate = dateStr;
      localStorage.setItem(STORAGE_PREFIX + "selected_date", selectedDate);
      currentRound = getActiveRoundForDate(selectedDate);
      localStorage.setItem(roundStorageKey(selectedDate), String(currentRound));
      quizCardsBlurred = false;
      resetQuizView();
      render();
    }

    function renderCards() {
      const todayWords = getTodayWords();
      document.getElementById("dayTitle").textContent = formatKoreanDate(selectedDate);
      document.getElementById("roundText").textContent = currentRound + "세트";
      document.getElementById("roundStars").innerHTML = starHtmlForDate(selectedDate);
      grid.innerHTML = "";

      todayWords.forEach((item) => {
        const card = document.createElement("article");
        card.className = "card";
        const knownClass = isKnown(item.studyKey) ? "known-status done" : "known-status";
        const knownText = isKnown(item.studyKey) ? "외움 완료" : "문제 맞히면 체크";
        const blurClass = quizCardsBlurred ? "quiz-blur" : "";
        const meanClass = (hideMeanings || quizCardsBlurred) ? "mean hidden" : "mean";
        const speakDisabled = quizCardsBlurred ? "disabled" : "";

        card.innerHTML = `
          <div>
            <div class="num">#${item.displayNo} · ${currentRound}세트</div>
            <div class="word ${blurClass}">${item.word}</div>
            <div class="${meanClass}">${item.meaning}</div>
            <div class="ex ${blurClass}">
              <strong>예문</strong>: ${item.example}<br>
              <strong>뜻</strong>: ${item.exampleMeaning}
            </div>
          </div>
          <div class="bottom">
            <button class="speak" data-word="${item.word}" ${speakDisabled}>듣기</button>
            <div class="${knownClass}">${knownText}</div>
          </div>
        `;
        grid.appendChild(card);
      });

      document.querySelectorAll(".speak").forEach((btn) => { btn.addEventListener("click", () => speak(btn.dataset.word)); });
    }

    function renderCompleteList() {
      const panel = document.getElementById("allCompletePanel");
      const list = document.getElementById("allCompleteList");
      if (!panel || !list) return;

      if (!isDateComplete(selectedDate)) {
        panel.classList.remove("show");
        list.innerHTML = "";
        return;
      }

      panel.classList.add("show");
      list.innerHTML = "";
      getAllDateWords(selectedDate).forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "complete-item";
        div.innerHTML = `
          <strong>${index + 1}. ${item.word}</strong>
          <span>${item.meaning}</span>
          <span>예문: ${item.example}</span>
        `;
        list.appendChild(div);
      });
    }

    function updateProgress() {
      let count = 0;
      getTodayWords().forEach((item) => { if (isKnown(item.studyKey)) count++; });
      document.getElementById("knownCount").textContent = count;
      document.getElementById("bar").style.width = (count * 10) + "%";

      const addRoundBtn = document.getElementById("addRoundBtn");
      if (isRoundComplete(selectedDate, currentRound) && currentRound < ROUNDS_PER_DATE) {
        addRoundBtn.style.display = "inline-block";
        addRoundBtn.textContent = "하나더?! " + (currentRound + 1) + "세트 10단어 추가";
      } else {
        addRoundBtn.style.display = "none";
      }
    }

    function addNextRound() {
      if (!isRoundComplete(selectedDate, currentRound) || currentRound >= ROUNDS_PER_DATE) return;
      currentRound += 1;
      localStorage.setItem(roundStorageKey(selectedDate), String(currentRound));
      quizCardsBlurred = false;
      resetQuizView();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function toggleMeanings() {
      hideMeanings = !hideMeanings;
      document.getElementById("toggleBtn").textContent = hideMeanings ? "뜻 전체 보기" : "뜻 전체 가리기";
      renderCards();
    }

    function resetCurrentRound() {
      getTodayWords().forEach((item) => localStorage.removeItem(knownKey(item.studyKey)));
      localStorage.removeItem(wrongKey());
      setRoundComplete(selectedDate, currentRound, false);
      // 뒤 세트 완료 기록은 현재 세트가 깨지면 같이 지워서 별 순서가 꼬이지 않게 합니다.
      for (let r = currentRound + 1; r <= ROUNDS_PER_DATE; r++) setRoundComplete(selectedDate, r, false);
      quizCardsBlurred = false;
      resetQuizView();
      render();
    }

    function speak(word) {
      if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
        alert("이 브라우저에서는 듣기 기능을 지원하지 않습니다. 크롬이나 사파리 최신 버전으로 열어주세요.");
        return;
      }
      const play = () => {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(word);
        u.lang = "en-US"; u.rate = 0.8; u.pitch = 1; u.volume = 1;
        const voices = speechSynthesis.getVoices();
        const englishVoice = voices.find(v => v.lang === "en-US") || voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en")) || voices[0];
        if (englishVoice) u.voice = englishVoice;
        setTimeout(() => speechSynthesis.speak(u), 80);
      };
      if (speechSynthesis.getVoices().length === 0) {
        speechSynthesis.onvoiceschanged = () => { play(); speechSynthesis.onvoiceschanged = null; };
        setTimeout(play, 300);
      } else play();
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
    function normalizeAnswer(text) { return String(text || "").trim().toLowerCase().replace(/\s+/g, ""); }
    function getWrongIndexes() {
      const saved = localStorage.getItem(wrongKey());
      if (!saved) return [];
      try {
        return JSON.parse(saved).filter((key) => typeof key === "string");
      } catch { return []; }
    }
    function saveWrongIndexes(indexes) { localStorage.setItem(wrongKey(), JSON.stringify([...new Set(indexes)])); }
    function addWrong(studyKey) {
      const wrongs = getWrongIndexes();
      if (!wrongs.includes(studyKey)) wrongs.push(studyKey);
      saveWrongIndexes(wrongs);
      updateWrongList();
    }
    function removeWrong(studyKey) {
      saveWrongIndexes(getWrongIndexes().filter((key) => key !== studyKey));
      updateWrongList();
    }
    function clearTodayWrong() {
      // 오답 초기화는 오답 목록만 비웁니다.
      // 문제풀이 창을 닫거나 현재 출제 중인 문제를 초기화하지 않습니다.
      localStorage.removeItem(wrongKey());
      updateWrongList();

      const answerBox = document.getElementById("quizAnswer");
      if (answerBox) {
        answerBox.style.display = "block";
        answerBox.className = "correct";
        answerBox.textContent = "오답 목록이 초기화되었습니다. 현재 문제풀이는 그대로 이어서 진행할 수 있습니다.";
      }
    }

    function resetQuizView() {
      const quizPanel = document.getElementById("quizPanel");
      if (quizPanel) quizPanel.classList.remove("show");
      currentQuiz = null;
      currentQuizResolved = false;
      quizPool = [];
      reviewMode = false;
      quizSessionActive = false;
      reviewSessionHadQuestions = false;
      document.getElementById("quizModeText").textContent = "일반 복습 모드";
      document.getElementById("quizQuestion").textContent = "아직 문제가 없습니다.";
      document.getElementById("quizInput").value = "";
      const answerBox = document.getElementById("quizAnswer");
      answerBox.style.display = "none";
      answerBox.textContent = "";
      answerBox.className = "";
      const loveMessage = document.getElementById("loveMessage");
      if (loveMessage) { loveMessage.style.display = "none"; loveMessage.textContent = ""; }
    }

    function returnToStudy() {
      quizCardsBlurred = false;
      resetQuizView();
      render();
    }

    function startNormalQuiz() {
      document.getElementById("quizPanel").classList.add("show");
      reviewMode = false;
      quizSessionActive = true;
      reviewSessionHadQuestions = false;
      quizCardsBlurred = true;
      const loveMessage = document.getElementById("loveMessage");
      if (loveMessage) { loveMessage.style.display = "none"; loveMessage.textContent = ""; }
      renderCards();
      updateWrongList();

      quizPool = shuffleArray(getTodayWords().map((item) => ({ ...item })));
      document.getElementById("quizModeText").textContent = "일반 복습 모드: 10문제 중 0문제 풀이";
      nextQuiz();
    }

    function startWrongQuiz() {
      document.getElementById("quizPanel").classList.add("show");
      const wrongs = getWrongIndexes();
      if (wrongs.length === 0) {
        currentQuiz = null;
        quizPool = [];
        reviewMode = false;
        quizSessionActive = false;
        reviewSessionHadQuestions = false;
        quizCardsBlurred = false;
        render();
        document.getElementById("quizModeText").textContent = "오답이 없습니다.";
        document.getElementById("quizQuestion").textContent = "오답풀이할 문제가 없습니다. 먼저 일반 복습 문제를 풀어주세요.";
        const answerBox = document.getElementById("quizAnswer");
        answerBox.style.display = "block";
        answerBox.className = "";
        answerBox.textContent = "오답 초기화 후에는 오답풀이만으로 학습 완료 처리되지 않습니다.";
        return;
      }
      reviewMode = true;
      quizSessionActive = true;
      reviewSessionHadQuestions = true;
      quizCardsBlurred = true;
      renderCards();
      updateWrongList();
      quizPool = shuffleArray(wrongs.map(getItemByStudyKey).filter(Boolean));
      document.getElementById("quizModeText").textContent = "오답풀이 모드: 저장된 오답 " + quizPool.length + "개를 다시 풉니다.";
      nextQuiz();
    }

    function nextQuiz() {
      document.getElementById("quizInput").value = "";
      document.getElementById("quizInput").focus();
      const answerBox = document.getElementById("quizAnswer");
      answerBox.style.display = "none";
      answerBox.className = "";

      if (quizPool.length === 0) {
        currentQuiz = null;
        if (reviewMode) {
          if (reviewSessionHadQuestions && getWrongIndexes().length === 0) {
            markRoundComplete();
            document.getElementById("quizModeText").textContent = "오답풀이 완료";
            document.getElementById("quizQuestion").textContent = "오답이 모두 없어졌습니다. 현재 세트 별이 채워졌습니다.";
            answerBox.style.display = "block";
            answerBox.className = "correct";
            answerBox.textContent = "완료! 현재 세트를 끝냈습니다.";
          } else {
            document.getElementById("quizModeText").textContent = "오답풀이 1회 완료";
            document.getElementById("quizQuestion").textContent = "아직 오답이 남아 있습니다. 오답풀이 버튼을 눌러 다시 풀어보세요.";
          }
          render();
          return;
        }
        if (!quizSessionActive) return;
        const wrongs = getWrongIndexes();
        if (wrongs.length > 0) {
          document.getElementById("quizModeText").textContent = "일반 복습 10문제 완료 → 오답풀이로 자동 이동";
          document.getElementById("quizQuestion").textContent = "오답 " + wrongs.length + "개가 있어 오답풀이를 시작합니다.";
          setTimeout(startWrongQuiz, 800);
        } else {
          markRoundComplete();
          document.getElementById("quizModeText").textContent = "일반 복습 완료";
          document.getElementById("quizQuestion").textContent = "10문제를 모두 맞혔습니다. 현재 세트 별이 채워졌습니다.";
          answerBox.style.display = "block";
          answerBox.className = "correct";
          answerBox.textContent = currentRound < ROUNDS_PER_DATE ? "완료! 하나더 버튼으로 다음 10단어를 열 수 있습니다." : "완료! 오늘 별 3개를 모두 채웠습니다.";
          render();
        }
        return;
      }

      currentQuiz = quizPool.shift();
      currentQuizResolved = false;
      if (!reviewMode) {
        const solved = WORDS_PER_ROUND - quizPool.length;
        document.getElementById("quizModeText").textContent = "일반 복습 모드: 10문제 중 " + solved + "문제 풀이";
      } else {
        document.getElementById("quizModeText").textContent = "오답풀이 모드";
      }
      document.getElementById("quizQuestion").textContent = "Q. '" + currentQuiz.meaning + "'에 해당하는 영어 단어는?";
    }

    function checkAnswer() {
      if (!currentQuiz) { startNormalQuiz(); return; }
      const userAnswer = document.getElementById("quizInput").value;
      const answerBox = document.getElementById("quizAnswer");
      const isCorrect = normalizeAnswer(userAnswer) === normalizeAnswer(currentQuiz.word);
      answerBox.style.display = "block";
      if (isCorrect) {
        currentQuizResolved = true;
        markKnown(currentQuiz.studyKey);
        removeWrong(currentQuiz.studyKey);
        renderCards();
        updateProgress();
        answerBox.className = "correct";
        answerBox.textContent = "정답입니다! " + currentQuiz.word;
        setTimeout(() => {
          if (reviewMode && getWrongIndexes().length === 0) quizPool = [];
          nextQuiz();
        }, 650);
      } else {
        currentQuizResolved = true;
        unmarkKnown(currentQuiz.studyKey);
        addWrong(currentQuiz.studyKey);
        renderCards();
        updateProgress();
        answerBox.className = "wrong";
        answerBox.textContent = "오답입니다. 입력한 답: " + (userAnswer || "빈칸") + " / 정답: " + currentQuiz.word;
        setTimeout(nextQuiz, 1100);
      }
    }


    function skipOrNextQuiz() {
      if (!currentQuiz) {
        nextQuiz();
        return;
      }

      // 답을 체크하지 않고 다음 문제를 누르면 정답 처리하지 않습니다.
      // 현재 문제를 오답으로 저장한 뒤 다음 문제로 넘어갑니다.
      if (!currentQuizResolved) {
        currentQuizResolved = true;
        unmarkKnown(currentQuiz.studyKey);
        addWrong(currentQuiz.studyKey);
        renderCards();
        updateProgress();
      }

      nextQuiz();
    }

    function showAnswer() {
      if (!currentQuiz) { startNormalQuiz(); return; }
      currentQuizResolved = true;
      unmarkKnown(currentQuiz.studyKey);
      addWrong(currentQuiz.studyKey);
      renderCards();
      updateProgress();
      const answer = document.getElementById("quizAnswer");
      answer.style.display = "block";
      answer.className = "wrong";
      answer.innerHTML = "정답: " + currentQuiz.word + "<br>예문: " + currentQuiz.example + "<br>예문 뜻: " + currentQuiz.exampleMeaning + "<br>정답 보기를 눌렀기 때문에 오답에 저장되었습니다. 다음 문제 버튼을 누르면 넘어갑니다.";
    }

    function markRoundComplete() {
      getTodayWords().forEach((item) => markKnown(item.studyKey));
      localStorage.removeItem(wrongKey());
      setRoundComplete(selectedDate, currentRound, true);
      localStorage.setItem(roundStorageKey(selectedDate), String(currentRound));
      quizCardsBlurred = false;
      render();
      const loveMessage = document.getElementById("loveMessage");
      if (loveMessage) {
        loveMessage.style.display = "block";
        loveMessage.textContent = getRandomCompleteMessage();
      }
      if (isDateComplete(selectedDate)) {
        setTimeout(() => {
          const panel = document.getElementById("allCompletePanel");
          if (panel) panel.scrollIntoView({ behavior: "smooth", block: "start" });
        }, 300);
      }
    }

    function updateWrongList() {
      const wrongs = getWrongIndexes();
      const box = document.getElementById("wrongList");
      if (!box) return;
      if (reviewMode) {
        box.style.display = "none";
        box.textContent = "";
        return;
      }
      box.style.display = "block";
      if (wrongs.length === 0) {
        box.textContent = "저장된 오답: 0개";
        return;
      }
      const names = wrongs.map(getItemByStudyKey).filter(Boolean).map((item) => item.word);
      box.textContent = "저장된 오답 " + names.length + "개: " + names.join(", ");
    }

    init();
  </script>
</body>
</html>
